[project]
name = "ai-study-mate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.3.2",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.11",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "pdf2image>=1.17.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.21.0",
    "pytesseract>=0.3.13",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "streamlit[auth]>=1.66.0",
    "supabase>=2.33.0",
]

[project.scripts]
ai-study-mate = "ai_study_mate:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
